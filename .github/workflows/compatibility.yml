name: Shield Compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      shield: ${{ steps.matrix.outputs.shield }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: matrix
        run: |
          versions=$(jq -ce . .github/shield-versions.json)
          printf 'shield=%s\n' "$versions" >> "$GITHUB_OUTPUT"

  compatibility:
    needs: versions
    name: Shield ${{ matrix.shield }} / PHP 8.2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shield: ${{ fromJSON(needs.versions.outputs.shield) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.2'
          extensions: intl, mbstring, sqlite3
          coverage: none

      - name: Install selected Shield version
        env:
          SHIELD_VERSION: ${{ matrix.shield }}
        run: composer update --with "codeigniter4/shield:$SHIELD_VERSION" --no-interaction --prefer-dist --no-progress

      - name: Run LDAP unit and feature tests
        run: composer test -- --no-coverage
